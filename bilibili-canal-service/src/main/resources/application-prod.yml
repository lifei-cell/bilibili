spring:
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR}
        username: ${SPRING_CLOUD_NACOS_USERNAME}
        password: ${SPRING_CLOUD_NACOS_PASSWORD}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}

canal:
  server:
    host: ${CANAL_SERVER_HOST}
    port: ${CANAL_SERVER_PORT:11111}
    username: ${CANAL_USERNAME}
    password: ${CANAL_PASSWORD}
