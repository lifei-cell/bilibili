server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: bilibili-danmu-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/bilibili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis123}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:rocketmq-namesrv:9876}

danmu:
  netty:
    port: ${DANMU_NETTY_PORT:8093}
  persist:
    batch-size: ${DANMU_PERSIST_BATCH_SIZE:100}
    flush-interval: ${DANMU_PERSIST_FLUSH_INTERVAL:100}
  stats:
    sync-interval: ${DANMU_STATS_SYNC_INTERVAL:60000}
    sync-initial-delay: ${DANMU_STATS_SYNC_INITIAL_DELAY:60000}

