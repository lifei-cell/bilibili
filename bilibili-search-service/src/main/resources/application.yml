server:
  port: ${SERVER_PORT:8085}

spring:
  config:
    import: optional:classpath:observability.yml
  application:
    name: bilibili-search-service
  profiles:
    default: dev
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:3s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:5s}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis123}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos:8848}
        fail-fast: ${SPRING_CLOUD_NACOS_DISCOVERY_FAIL_FAST:false}

search:
  hot:
    max-size: ${SEARCH_HOT_MAX_SIZE:100}
