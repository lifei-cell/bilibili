x-small-resource: &small-resource
  mem_limit: 512m
  cpus: 0.50

x-medium-resource: &medium-resource
  mem_limit: 1g
  cpus: 1.00

services:
  mysql:
    <<: *medium-resource
    image: mysql:8.4
    container_name: bilibili-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bilibili
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - bilibili-net

  redis:
    <<: *small-resource
    image: redis:7.4
    container_name: bilibili-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6380:6379" #本地redis已经占用6379端口，所以用6380映射到容器的6379端口，方便外部访问
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - bilibili-net

  nacos:
    <<: *medium-resource
    image: nacos/nacos-server:v3.1.1
    container_name: bilibili-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "VGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktbmFjb3MtdG9rZW4tZm9yLWJpbGliaWxp"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "bilibiliNacos"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - bilibili-net

  rocketmq-namesrv:
    <<: *small-resource
    image: apache/rocketmq:5.3.1
    container_name: bilibili-rocketmq-namesrv
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx256m -XX:+UseG1GC
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks:
      - bilibili-net

  rocketmq-broker:
    <<: *medium-resource
    image: apache/rocketmq:5.3.1
    container_name: bilibili-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx768m -XX:+UseG1GC
    command: sh mqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    networks:
      - bilibili-net

  elasticsearch:
    <<: *medium-resource
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: bilibili-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es9_data:/usr/share/elasticsearch/data
    networks:
      - bilibili-net

  minio:
    <<: *small-resource
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: bilibili-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bilibili-net

  canal:
    <<: *small-resource
    image: canal/canal-server:v1.1.8
    container_name: bilibili-canal
    restart: unless-stopped
    depends_on:
      - mysql
      - rocketmq-namesrv
    ports:
      - "11111:11111"
    volumes:
      - ./docker/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    networks:
      - bilibili-net

  nginx:
    <<: *small-resource
    image: nginx:1.27
    container_name: bilibili-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bilibili-net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: bilibili-prometheus
    restart: unless-stopped
    <<: *small-resource
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - bilibili-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: bilibili-alertmanager
    restart: unless-stopped
    <<: *small-resource
    ports:
      - "9093:9093"
    volumes:
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - bilibili-net

  grafana:
    image: grafana/grafana:12.1.0
    container_name: bilibili-grafana
    restart: unless-stopped
    <<: *small-resource
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - bilibili-net

  tempo:
    image: grafana/tempo:2.8.2
    container_name: bilibili-tempo
    restart: unless-stopped
    <<: *small-resource
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - bilibili-net

  loki:
    image: grafana/loki:3.5.2
    container_name: bilibili-loki
    restart: unless-stopped
    <<: *small-resource
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - bilibili-net

  promtail:
    image: grafana/promtail:3.5.2
    container_name: bilibili-promtail
    restart: unless-stopped
    <<: *small-resource
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./docker/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - bilibili-net

  rocketmq-exporter:
    image: apache/rocketmq-exporter:0.0.2
    container_name: bilibili-rocketmq-exporter
    restart: unless-stopped
    <<: *small-resource
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m -XX:+UseG1GC
    command:
      - --rocketmq.config.namesrvAddr=rocketmq-namesrv:9876
    ports:
      - "5557:5557"
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    networks:
      - bilibili-net

networks:
  bilibili-net:
    name: bilibili-net
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  es9_data:
  minio_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
