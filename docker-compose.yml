services:
  mysql:
    image: mysql:8.4
    container_name: bilibili-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bilibili
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - bilibili-net

  redis:
    image: redis:7.4
    container_name: bilibili-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6380:6379" #本地redis已经占用6379端口，所以用6380映射到容器的6379端口，方便外部访问
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - bilibili-net

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: bilibili-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "VGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktbmFjb3MtdG9rZW4tZm9yLWJpbGliaWxp"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "bilibiliNacos"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - bilibili-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: bilibili-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks:
      - bilibili-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: bilibili-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    networks:
      - bilibili-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: bilibili-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es9_data:/usr/share/elasticsearch/data
    networks:
      - bilibili-net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: bilibili-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bilibili-net

  canal:
    image: canal/canal-server:v1.1.8
    container_name: bilibili-canal
    restart: unless-stopped
    depends_on:
      - mysql
      - rocketmq-namesrv
    ports:
      - "11111:11111"
    volumes:
      - ./docker/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    networks:
      - bilibili-net

  nginx:
    image: nginx:1.27
    container_name: bilibili-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bilibili-net

networks:
  bilibili-net:
    name: bilibili-net
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  es9_data:
  minio_data:
