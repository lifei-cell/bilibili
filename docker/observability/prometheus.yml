global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: bilibili-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bilibili-gateway:8080
          - bilibili-user-service:8081
          - bilibili-video-service:8082
          - bilibili-danmu-service:8083
          - bilibili-social-service:8084
          - bilibili-search-service:8085
          - bilibili-canal-service:8086
  - job_name: rocketmq
    static_configs:
      - targets: [rocketmq-exporter:5557]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
