server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    import: optional:classpath:observability.yml
  application:
    name: bilibili-video-service
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/bilibili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis123}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos:8848}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:rocketmq-namesrv:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:bilibili-video-producer}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://minio:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  video-bucket: ${MINIO_VIDEO_BUCKET:videos}
  temp-bucket: ${MINIO_TEMP_BUCKET:tmp}
  public-read-enabled: ${MINIO_PUBLIC_READ_ENABLED:true}
  lifecycle:
    temp-days: ${MINIO_TEMP_LIFECYCLE_DAYS:1}
    source-days: ${MINIO_SOURCE_LIFECYCLE_DAYS:30}

cdn:
  # Point this at the CDN distribution in production; MinIO remains the origin.
  base-url: ${CDN_BASE_URL:${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://minio:9000}}}

video:
  list-cache:
    ttl-seconds: ${VIDEO_LIST_CACHE_TTL_SECONDS:5}
  stats:
    sync-enabled: ${VIDEO_STATS_SYNC_ENABLED:true}
    sync-interval: ${VIDEO_STATS_SYNC_INTERVAL:60000}
    sync-initial-delay: ${VIDEO_STATS_SYNC_INITIAL_DELAY:60000}
  transcode:
    publisher-enabled: ${VIDEO_TRANSCODE_PUBLISHER_ENABLED:true}
    consumer-enabled: ${VIDEO_TRANSCODE_CONSUMER_ENABLED:true}
    dispatch-interval: ${VIDEO_TRANSCODE_DISPATCH_INTERVAL:1000}
    dispatch-initial-delay: ${VIDEO_TRANSCODE_DISPATCH_INITIAL_DELAY:5000}
    max-retries: ${VIDEO_TRANSCODE_MAX_RETRIES:3}
    retry-delay-seconds: ${VIDEO_TRANSCODE_RETRY_DELAY_SECONDS:10}
    # Heartbeat renews the database lease while FFmpeg is running.
    lease-seconds: ${VIDEO_TRANSCODE_LEASE_SECONDS:120}
    ffmpeg-path: ${VIDEO_TRANSCODE_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${VIDEO_TRANSCODE_FFPROBE_PATH:ffprobe}
    temp-dir: ${VIDEO_TRANSCODE_TEMP_DIR:/tmp/bilibili-transcode}
    timeout-seconds: ${VIDEO_TRANSCODE_TIMEOUT_SECONDS:1800}
    output-prefix: ${VIDEO_TRANSCODE_OUTPUT_PREFIX:play}
    # auto selects an exposed GPU device and falls back to libx264 when unavailable.
    encoder: ${VIDEO_TRANSCODE_ENCODER:auto}
    hardware-fallback: ${VIDEO_TRANSCODE_HARDWARE_FALLBACK:true}
    software-preset: ${VIDEO_TRANSCODE_SOFTWARE_PRESET:veryfast}
    crf: ${VIDEO_TRANSCODE_CRF:22}
    hls-segment-seconds: ${VIDEO_TRANSCODE_HLS_SEGMENT_SECONDS:6}
    progressive-publish: ${VIDEO_TRANSCODE_PROGRESSIVE_PUBLISH:true}
  view:
    consumer-enabled: ${VIDEO_VIEW_CONSUMER_ENABLED:true}

