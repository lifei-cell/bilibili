x-java-resource: &java-resource
  mem_limit: 768m
  cpus: 1.00

x-java-environment: &java-environment
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
  OPERATIONS_ADMIN_TOKEN: ${OPERATIONS_ADMIN_TOKEN:-change-me-in-production}

services:
  bilibili-gateway:
    <<: *java-resource
    image: bilibili-gateway:0.0.1
    build:
      context: ./bilibili-gateway
    container_name: bilibili-gateway
    restart: unless-stopped
    environment:
      <<: *java-environment
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      DANMU_WEBSOCKET_URI: ws://bilibili-danmu-service:8093
      # Enable only when the gateway is reachable exclusively through a trusted proxy.
      GATEWAY_RATE_LIMIT_TRUST_FORWARDED_FOR: ${GATEWAY_RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bilibili-net

  bilibili-user-service:
    <<: *java-resource
    image: bilibili-user-service:0.0.1
    build:
      context: ./bilibili-user-service
    container_name: bilibili-user-service
    restart: unless-stopped
    environment:
      <<: *java-environment
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_FAIL_FAST: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bilibili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - bilibili-net

  bilibili-video-service:
    <<: *java-resource
    image: bilibili-video-service:0.0.1
    build:
      context: ./bilibili-video-service
    container_name: bilibili-video-service
    restart: unless-stopped
    environment:
      <<: *java-environment
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bilibili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - bilibili-net

  bilibili-danmu-service:
    <<: *java-resource
    image: bilibili-danmu-service:0.0.1
    build:
      context: ./bilibili-danmu-service
    container_name: bilibili-danmu-service
    restart: unless-stopped
    environment:
      <<: *java-environment
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bilibili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      DANMU_NETTY_PORT: 8093
    ports:
      - "8083:8083"
      - "8093:8093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_healthy
    networks:
      - bilibili-net

  bilibili-social-service:
    <<: *java-resource
    image: bilibili-social-service:0.0.1
    build:
      context: ./bilibili-social-service
    container_name: bilibili-social-service
    restart: unless-stopped
    environment:
      <<: *java-environment
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bilibili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_healthy
    networks:
      - bilibili-net

  bilibili-search-service:
    <<: *java-resource
    image: bilibili-search-service:0.0.1
    build:
      context: ./bilibili-search-service
    container_name: bilibili-search-service
    restart: unless-stopped
    environment:
      <<: *java-environment
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - bilibili-net

  bilibili-canal-service:
    <<: *java-resource
    image: bilibili-canal-service:0.0.1
    build:
      context: ./bilibili-canal-service
    container_name: bilibili-canal-service
    restart: unless-stopped
    environment:
      <<: *java-environment
      SERVER_PORT: 8086
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bilibili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      CANAL_SERVER_HOST: canal
      CANAL_SERVER_PORT: 11111
      CANAL_DESTINATION: example
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_healthy
      canal:
        condition: service_started
    networks:
      - bilibili-net

networks:
  bilibili-net:
    name: bilibili-net
    driver: bridge
