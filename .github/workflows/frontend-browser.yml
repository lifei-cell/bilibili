name: Frontend browser journeys

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bilibili-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bilibili-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser journeys and recovery drill
        run: npm run test:e2e
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failures
          path: |
            bilibili-web/test-results/
            bilibili-web/playwright-report/
          if-no-files-found: warn
