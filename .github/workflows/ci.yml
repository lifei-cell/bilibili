name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_fault_drill:
        description: Run MQ, Redis and Elasticsearch fault recovery drills
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify unit, integration and coverage gates
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: "**/target/site/jacoco/"
          if-no-files-found: warn

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bilibili-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bilibili-web/package-lock.json
      - run: npm ci
      - name: Lint, test with coverage, type-check and build
        run: npm run quality
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: bilibili-web/coverage/
          if-no-files-found: warn

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged Compose model
        run: docker compose -f docker-compose.yml -f docker-compose.service.yml -f docker-compose.e2e.yml config --quiet

  reliability-e2e:
    name: Reliability Compose E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run core journey and fault recovery
        shell: pwsh
        run: |
          $faultArgs = @()
          if ('${{ github.event_name }}' -eq 'schedule' -or '${{ inputs.run_fault_drill }}' -eq 'true') {
            $faultArgs += '-RunFaultDrill'
          }
          ./scripts/e2e/reliability-e2e.ps1 @faultArgs
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.service.yml -f docker-compose.e2e.yml logs --no-color --tail 300 > reliability-e2e.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-e2e-diagnostics
          path: reliability-e2e.log
