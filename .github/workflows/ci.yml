name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_fault_drill:
        description: Run MQ, Redis and Elasticsearch fault recovery drills
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install real media tools for transcode fault matrix
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare isolated MinIO test image
        run: |
          source scripts/e2e/prepare-minio-test-image.sh
          echo "MINIO_TEST_IMAGE=$MINIO_TEST_IMAGE" >> "$GITHUB_ENV"
      - name: Verify unit, integration, transcode faults and coverage gates
        run: mvn --batch-mode --no-transfer-progress verify -Dtranscode.fault.matrix=true
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: "**/target/site/jacoco/"
          if-no-files-found: warn

      - name: Upload transcode fault matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcode-fault-matrix
          path: bilibili-video-service/target/failsafe-reports/*TranscodeFaultMatrixIT*
          if-no-files-found: error

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bilibili-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bilibili-web/package-lock.json
      - run: npm ci
      - name: Lint, test with coverage, type-check and build
        run: npm run quality
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression with simulated gateway
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: |
            bilibili-web/playwright-report/
            bilibili-web/test-results/
          if-no-files-found: warn
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: bilibili-web/coverage/
          if-no-files-found: warn

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged Compose model
        run: docker compose -f docker-compose.yml -f docker-compose.service.yml -f docker-compose.e2e.yml config --quiet
      - name: Verify message lifecycle alert rules
        run: docker run --rm -v "$PWD/docker/observability:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules /rules/tests/message-lifecycle.test.yml

  release-validation:
    name: Release validation and write-path SLO
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bilibili-web/package-lock.json
      - name: Prepare real browser journey
        working-directory: bilibili-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run backend verify, core journey and write-path SLO
        shell: pwsh
        run: |
          $faultArgs = @()
          if ('${{ github.event_name }}' -eq 'schedule' -or '${{ inputs.run_fault_drill }}' -eq 'true') {
            $faultArgs += '-RunFaultDrill'
          }
          ./scripts/verification/release-validation.ps1 -RunBrowserE2e @faultArgs
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.service.yml -f docker-compose.e2e.yml logs --no-color --tail 300 > reliability-e2e.log
      - name: Upload release-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-evidence-${{ github.run_id }}
          path: |
            reliability-e2e.log
            loadtest/results/release-validation-*/
            bilibili-web/playwright-report/
            bilibili-web/test-results/
          if-no-files-found: warn
          retention-days: 14
