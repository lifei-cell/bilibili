services:
  bilibili-video-service:
    environment:
      # CI and ordinary Docker Desktop runners have no GPU device. Keep the
      # media E2E deterministic; dedicated GPU Compose overlays still use NVENC.
      VIDEO_TRANSCODE_ENCODER: software
      VIDEO_TRANSCODE_DISPATCH_INTERVAL: 500
      VIDEO_TRANSCODE_DISPATCH_INITIAL_DELAY: 1000
      OUTBOX_DISPATCH_INTERVAL: 250
      OUTBOX_INITIAL_DELAY: 1000
      VIDEO_STATS_SYNC_INTERVAL: 1000
      VIDEO_STATS_SYNC_INITIAL_DELAY: 1000

  bilibili-danmu-service:
    environment:
      DANMU_PERSIST_FLUSH_INTERVAL: 50
      DANMU_STATS_SYNC_INTERVAL: 1000
      DANMU_STATS_SYNC_INITIAL_DELAY: 1000
      OUTBOX_DISPATCH_INTERVAL: 250
      OUTBOX_INITIAL_DELAY: 1000

  bilibili-social-service:
    environment:
      SOCIAL_STATS_SYNC_INTERVAL: 1000
      SOCIAL_STATS_SYNC_INITIAL_DELAY: 1000

  bilibili-canal-service:
    environment:
      CANAL_PULL_INTERVAL: 250
      CANAL_INITIAL_DELAY: 1000
      OUTBOX_DISPATCH_INTERVAL: 250
      OUTBOX_INITIAL_DELAY: 1000
      MQ_CONSUME_MAX_ATTEMPTS: 1
